services:
  - type: web
    name: dairychain
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm --prefix server ci --omit=dev && npm run build && npm --prefix server run seed
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: SENSOR_TOKEN
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
